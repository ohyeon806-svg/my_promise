<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7e6ee"><title>🌷 나와의 약속</title><style>*{box-sizing:border-box}body{margin:0;background:#fcfafb;color:#554b53;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif}main{max-width:620px;margin:auto;padding:22px 15px 65px}.card{background:white;border:1px solid #f0e9ee;border-radius:20px;padding:18px;margin-bottom:15px;box-shadow:0 4px 22px #ad8b9d0c}h1{font-size:27px;margin:5px 0}h2{font-size:17px;margin:0}.muted{color:#9b8e98;font-size:12px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:17px}.stat{background:#faf5f8;border-radius:12px;text-align:center;padding:13px 4px}.stat b{display:block;font-size:23px}.stat small{font-size:11px;color:#948992}button{font:inherit;cursor:pointer;color:inherit}.nav{border:0;background:#faf3f7;border-radius:12px;padding:8px 14px;font-size:20px}.strip{display:flex;gap:3px;margin:13px 0 18px}.strip span{flex:1;height:19px;border-radius:3px;min-width:0}.week,.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;text-align:center}.week{font-size:12px;color:#a0949e;margin-bottom:10px}.day{height:49px;border:1px solid transparent;border-radius:10px;background:#f7f4f6;font-size:13px}.day:disabled{opacity:.3;cursor:default}.day.active{border:2px solid #806675}.day .mark{display:block;font-size:10px}.legend{display:flex;align-items:center;justify-content:flex-end;gap:5px;margin-top:14px;font-size:11px;color:#998d97}.swatch{height:13px;width:13px;border-radius:3px}.rule{width:100%;display:flex;align-items:center;gap:11px;text-align:left;border:1px solid #eee7ec;background:white;border-radius:13px;padding:15px;margin:9px 0}.rule.checked{background:var(--pale);border-color:var(--tone)}.rule .name{flex:1}.tick{height:24px;width:24px;border:1.5px solid #c8bac4;border-radius:7px;display:grid;place-items:center}.checked .tick{background:var(--tone);border-color:var(--tone);color:white}.history{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin-top:12px}.history button{border:0;border-radius:5px;height:27px;font-size:10px}.history button:disabled{opacity:.2}.past{padding:14px;border:1px solid #f1e9ef;border-radius:14px;margin-top:12px}.message{text-align:center;background:#faf6f9;padding:12px;border-radius:12px;font-size:13px}.actions{display:flex;gap:8px}.actions button{flex:1;padding:12px;border:1px solid #eadde6;background:white;border-radius:12px;font-size:13px}textarea{width:100%;border:1px solid #e8dce5;border-radius:10px;padding:10px;margin-top:10px;min-height:80px}#backupArea{display:none}footer{text-align:center;font-size:11px;color:#aa9da7;margin-top:18px}</style></head><body><main><section class="card"><div class="muted">MY LITTLE PROMISE</div><h1>🌷 나와의 약속</h1><div class="muted">하루 세 가지, 작은 약속을 쌓아가는 기록</div><div class="stats"><div class="stat"><b id="perfect">0</b><small>완벽한 날</small></div><div class="stat"><b id="streak">0</b><small>연속 성공일</small></div><div class="stat"><b id="total">0</b><small>지킨 약속</small></div></div></section><section class="card"><div class="row"><button class="nav" id="prev" aria-label="이전 달">‹</button><h2 id="month"></h2><button class="nav" id="next" aria-label="다음 달">›</button></div><p class="muted">DAILY COLOR LOG</p><div class="strip" id="strip"></div><div class="week"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div><div class="calendar" id="calendar"></div><div class="legend" id="legend"></div></section><section class="card" id="checkSection"><div class="muted">DAILY CHECK-IN</div><div class="row" style="margin-top:5px"><h2 id="chosen"></h2><span id="score" style="border-radius:30px;padding:5px 10px;font-size:12px"></span></div><p class="muted">먹지 않은 항목을 체크해 줘. 다시 누르면 취소돼.</p><div id="rules"></div><div class="message" id="message"></div></section><section class="card"><h2>🗂️ 지난 기록 모아보기</h2><p class="muted">달마다 다른 파스텔 색으로 기록이 쌓여요.</p><div id="archive"></div></section><section class="card"><h2>💾 기록 백업 · 복원</h2><p class="muted">이 기기의 브라우저에 자동 저장돼요. 브라우저 데이터를 지우거나 기기를 바꾸기 전에 백업해 주세요.</p><div class="actions"><button id="export">백업 파일 저장</button><button id="import">백업 파일 불러오기</button></div><input type="file" id="file" accept="application/json,.json" hidden><div id="backupArea"><textarea id="backupText" placeholder="백업 JSON을 붙여넣으세요"></textarea><button class="nav" id="restore" style="font-size:13px">붙여넣은 기록 복원</button></div></section><footer>2026.10.19부터 시작하는 나의 작은 약속 🌷</footer></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),start='2026-10-19',tones=['#e7a8b8','#c6a9de','#a9bce7','#91c8c2','#accb96','#e4c38f','#e8b39d','#b7a8d9','#e5a4c0','#a8c7d9','#b6cba5','#e2b6a7'];let records={};try{const raw=JSON.parse(localStorage.getItem('promise-calendar-v1')||'{}');if(raw&&typeof raw==='object'&&!Array.isArray(raw))records=raw}catch(e){}let now=new Date();now.setHours(0,0,0,0);let view=new Date(now.getFullYear(),now.getMonth(),1);if(view<new Date(2026,9,1))view=new Date(2026,9,1);let selected=now>=new Date(2026,9,19)?dateKey(now):start;const labels=['🥡 배달음식 금지','🍰 디저트 금지','🧋 액상과당 금지'];function dateKey(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function dateFrom(s){let [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}function valid(s){return s>=start&&dateFrom(s)<=now}function flags(s){return Array.isArray(records[s])?records[s]:[false,false,false]}function count(s){return flags(s).filter(Boolean).length}function color(m,n){return n===0?'#f6f2f5':`color-mix(in srgb,${tones[m]} ${[0,35,65,100][n]}%,white)`}function save(){try{localStorage.setItem('promise-calendar-v1',JSON.stringify(records))}catch(e){alert('저장 공간에 접근할 수 없어요. 백업을 이용해 주세요.')}}function select(s){selected=s;view=new Date(dateFrom(s).getFullYear(),dateFrom(s).getMonth(),1);render();$('checkSection').scrollIntoView({behavior:'smooth',block:'center'})}function render(){let y=view.getFullYear(),m=view.getMonth(),last=new Date(y,m+1,0).getDate();$('month').textContent=`${y}년 ${m+1}월`;$('prev').disabled=y===2026&&m===9;$('next').disabled=new Date(y,m+1,1)>now;$('calendar').replaceChildren();$('strip').replaceChildren();for(let i=0;i<new Date(y,m,1).getDay();i++)$('calendar').append(document.createElement('div'));for(let d=1;d<=last;d++){let s=dateKey(new Date(y,m,d)),n=count(s),ok=valid(s);let b=document.createElement('button');b.className='day'+(s===selected?' active':'');b.disabled=!ok;b.style.background=ok?color(m,n):'#f6f2f5';b.innerHTML=`${d}<span class="mark">${n?'●':'&nbsp;'}</span>`;b.onclick=()=>select(s);$('calendar').append(b);let bar=document.createElement('span');bar.style.background=ok?color(m,n):'#f6f2f5';bar.title=`${s}: ${n}/3`;$('strip').append(bar)}$('legend').innerHTML='0개 '+[0,1,2,3].map(n=>`<span class="swatch" style="background:${color(m,n)}"></span>`).join('')+' 3개';renderDetail();renderStats();renderArchive()}function renderDetail(){let n=count(selected),m=dateFrom(selected).getMonth();$('chosen').textContent=`${Number(selected.slice(5,7))}월 ${Number(selected.slice(8,10))}일의 약속`;$('score').textContent=`${n} / 3 성공`;$('score').style.background=color(m,n);$('rules').replaceChildren();labels.forEach((label,i)=>{let checked=!!flags(selected)[i],b=document.createElement('button');b.className='rule'+(checked?' checked':'');b.style.setProperty('--tone',tones[m]);b.style.setProperty('--pale',color(m,1));b.innerHTML=`<span class="name">${label}</span><span class="tick">${checked?'✓':''}</span>`;b.onclick=()=>{let a=[...flags(selected)];a[i]=!a[i];records[selected]=a;save();render()};$('rules').append(b)});$('message').textContent=['오늘도 나를 위한 작은 시작 🌱','한 가지 약속 성공! 🌼','두 가지나 지켰어! 🌷','세 가지 모두 성공! 💗'][n]}function renderStats(){let total=0,perfect=0;for(let [s] of Object.entries(records)){if(!valid(s))continue;total+=count(s);if(count(s)===3)perfect++}let streak=0,d=new Date(now);if(count(dateKey(d))!==3)d.setDate(d.getDate()-1);while(dateKey(d)>=start&&count(dateKey(d))===3){streak++;d.setDate(d.getDate()-1)}$('total').textContent=total;$('perfect').textContent=perfect;$('streak').textContent=streak}function renderArchive(){$('archive').replaceChildren();let limit=new Date(now.getFullYear(),now.getMonth(),1);for(let d=new Date(2026,9,1);d<=limit;d.setMonth(d.getMonth()+1)){let y=d.getFullYear(),m=d.getMonth(),last=new Date(y,m+1,0).getDate(),perfect=0;let outer=document.createElement('div');outer.className='past';let grid=document.createElement('div');grid.className='history';for(let i=0;i<new Date(y,m,1).getDay();i++)grid.append(document.createElement('span'));for(let j=1;j<=last;j++){let s=dateKey(new Date(y,m,j)),n=count(s),b=document.createElement('button');if(n===3)perfect++;b.textContent=j;b.disabled=!valid(s);b.style.background=color(m,n);b.onclick=()=>select(s);grid.append(b)}let title=document.createElement('div');title.className='row';title.innerHTML=`<b style="font-size:14px">${y}년 ${m+1}월</b><span class="muted">완벽한 날 ${perfect}일</span>`;outer.append(title,grid);$('archive').append(outer)}}$('prev').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()-1,1);render()};$('next').onclick=()=>{view=new Date(view.getFullYear(),view.getMonth()+1,1);render()};$('export').onclick=()=>{let blob=new Blob([JSON.stringify({version:1,records},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='나와의약속-백업.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('import').onclick=()=>$('file').click();function restore(data){if(!data||typeof data!=='object'||!data.records||typeof data.records!=='object')throw Error('올바른 백업 파일이 아니에요.');let clean={};for(let [k,v] of Object.entries(data.records)){if(/^\d{4}-\d{2}-\d{2}$/.test(k)&&dateKey(dateFrom(k))===k&&Array.isArray(v)&&v.length===3&&v.every(x=>typeof x==='boolean'))clean[k]=v}if(!confirm('기존 기록을 백업 파일의 기록으로 바꿀까요?'))return;records=clean;save();render();alert('복원했어요!')}$('file').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{restore(JSON.parse(await f.text()))}catch(err){alert(err.message)}e.target.value=''};$('restore').onclick=()=>{try{restore(JSON.parse($('backupText').value))}catch(e){alert(e.message)}};render()})();
</script></body></html>
